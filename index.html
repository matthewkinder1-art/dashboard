}

// ---- daily check-in: per-day ticks, sent to Claude, sleep auto-filled ----
function wireBody() {
  document.querySelectorAll('.bchart').forEach(ch => {
    const svg = ch.querySelector('svg'), label = ch.querySelector('.bctitle b');
    if (!svg || !label) return;
    const base = label.textContent;
    const dots = [...svg.querySelectorAll('circle')];
    const show = e => {
      const r = svg.getBoundingClientRect();
      const fx = (e.clientX - r.left) / r.width;
      let best = null, bd = 1e9;
      dots.forEach(c => {
        const d = Math.abs(c.cx.baseVal.value / svg.viewBox.baseVal.width - fx);
        if (d < bd) { bd = d; best = c; }
      });
      if (best) label.textContent = best.dataset.v + ' · ' + best.dataset.d;
    };
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') show(e); });
    svg.addEventListener('pointerleave', () => { label.textContent = base; });
  });
}

function wireCheckin() {
  const rows = document.querySelectorAll('#checkin .chk');
  if (!rows.length) return;
  const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
  const dateEl = document.getElementById('chkdate');
  if (dateEl) dateEl.textContent = '\u00b7 ' + new Intl.DateTimeFormat('en-GB',
    { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/London' }).format(new Date());
  const KEY = 'dash-chk-' + todayStr;
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (_) {}
  // prune old days
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('dash-chk-') && k !== KEY && k < 'dash-chk-' + todayStr.slice(0, 8) + '00') localStorage.removeItem(k);
    }
  } catch (_) {}

  rows.forEach(row => {
    const k = row.dataset.k;
    const sv = ((row.querySelector('.chkv') || {}).textContent || '').trim();
    // a bare server \u2713 is a synced manual tick (toggleable); a \u2713 with other
    // text beside it is a measurement (sleep hours, step count, kg) \u2014 locked
    const measured = sv.includes('\u2713') && sv !== '\u2713';
    if (measured) { row.classList.add('done'); return; }
    if (row.classList.contains('auto')) {
      if (sv.includes('\u2713')) row.classList.add('done');
      else if (sv.includes('\u2717')) row.classList.add('miss');
      return;
    }
    const serverDone = sv === '\u2713';
    // explicit local untick (state[k] === false) overrides a synced \u2713
    if (state[k] === false ? false : (state[k] || serverDone)) row.classList.add('done');
    row.addEventListener('click', () => {
      const on = !row.classList.contains('done');
      row.classList.toggle('done', on);
      state[k] = on;
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
      if (on) {
        sendNoteDirect('Checkin ' + todayStr + ': ' + k + ' done');
        if (k === 'weigh') {
          const v = window.prompt("This morning's weight (kg)?");
          const num = v && parseFloat(v.replace(',', '.'));
          if (num && num > 30 && num < 250) sendNoteDirect('weight: ' + num);
        }
      } else {
        sendNoteDirect('Checkin ' + todayStr + ': ' + k + ' undone');
      }
    });
  });
}

// ---- in-page Spotify player (Web Playback SDK, Premium) ----
let spPlayer = null, spDeviceId = null;
function spToken() { return document.querySelector('main')?.dataset.sp || ''; }

function wireSpotify() {
  if (!spToken() || document.getElementById('spbar')) return;

  const bar = document.createElement('div');
  bar.id = 'spbar';
  bar.innerHTML = '<div id="spprog"><i></i></div>' +
                  '<span id="sptitle">Loading player…</span>' +
                  '<span id="sptime"></span>' +
                  '<button id="spback" class="spsec" aria-label="back 15s">&#8630;15</button>' +
                  '<button id="spplay" aria-label="play/pause">&#9654;</button>' +
                  '<button id="spfwd" class="spsec" aria-label="forward 15s">15&#8631;</button>' +
                  '<button id="spx" class="spsec" aria-label="close">&#10005;</button>';
  bar.style.display = 'none';
  document.body.appendChild(bar);

  if (!/iPhone|iPad|Android/i.test(navigator.userAgent)) {
  window.onSpotifyWebPlaybackSDKReady = () => {
    spPlayer = new Spotify.Player({
      name: "Matthew's Dashboard",
      getOAuthToken: cb => cb(spToken()),
      volume: 1.0,
    });
    spPlayer.addListener('ready', ({ device_id }) => { spDeviceId = device_id; });
    spPlayer.addListener('player_state_changed', st => {
      if (!st) return;
      const t = st.track_window && st.track_window.current_track;
      document.getElementById('sptitle').textContent = t ? t.name : '';
      document.getElementById('spplay').innerHTML = st.paused ? '&#9654;' : '&#10074;&#10074;';
    });
    spPlayer.connect();
  };
  const tag = document.createElement('script');
  tag.src = 'https://sdk.scdn.co/spotify-player.js';
  document.head.appendChild(tag);
  }

  document.getElementById('spplay').addEventListener('click', () => spPlayer && spPlayer.togglePlay());
  const spSkip = ms => spPlayer && spPlayer.getCurrentState().then(st => {
    if (st) spPlayer.seek(Math.max(0, Math.min(st.duration - 1000, st.position + ms)));
  });
  document.getElementById('spback').addEventListener('click', () => spSkip(-15000));
  document.getElementById('spfwd').addEventListener('click', () => spSkip(15000));

  const fmt = ms => {
    const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
  };
  setInterval(() => {
    if (bar.style.display === 'none' || !spPlayer) return;
    spPlayer.getCurrentState().then(st => {
      if (!st) return;
      document.getElementById('sptime').textContent = fmt(st.position) + ' / ' + fmt(st.duration);
      document.querySelector('#spprog i').style.width = (100 * st.position / st.duration) + '%';
    });
  }, 1000);
  document.getElementById('spx').addEventListener('click', () => {
    if (spPlayer) spPlayer.pause();
    bar.style.display = 'none';
  });

  document.querySelectorAll('#pods .pod').forEach(row => {
    const btn = document.createElement('button');
    btn.className = 'spbtn';
    btn.innerHTML = '&#9654;';
    btn.addEventListener('click', async e => {
      e.preventDefault(); e.stopPropagation();
      btn.textContent = '…';
      try {
        // On phones, prefer playing through the native Spotify app (survives
        // locking the screen); the in-page player is the desktop experience.
        let target = null;
        const mobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
        if (mobile) {
          try {
            const dr = await fetch('https://api.spotify.com/v1/me/player/devices',
                                   { headers: { Authorization: 'Bearer ' + spToken() } });
            const devs = ((await dr.json()).devices) || [];
            const phone = devs.find(d => d.type === 'Smartphone') || devs.find(d => d.is_active);
            if (phone) target = phone.id;
          } catch (_) {}
        }
        if (!target && !mobile) {
          // the in-page SDK player is desktop-only; iOS can't run it
          if (spPlayer && spPlayer.activateElement) spPlayer.activateElement();
          for (let i = 0; i < 12 && !spDeviceId; i++) await new Promise(r => setTimeout(r, 500));
          if (!spDeviceId) throw new Error('no device');
          target = spDeviceId;
        }
        const title = (row.querySelector('.pt') || {}).textContent || '';
        const showName = (((row.querySelector('.pm') || {}).textContent || '').split('\u00b7')[1] || '').trim();
        const norm = x => x.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        const want = norm(title);
        const pick = items => items.find(it => {
          const got = norm(it.name || '');
          return got.startsWith(want.slice(0, 24)) || want.startsWith(got.slice(0, 24));
        });
        let hit = null;
        if (row.dataset.uri) hit = { uri: row.dataset.uri };
        const sid = row.dataset.sid;
        if (!hit && sid) {
          const er = await fetch('https://api.spotify.com/v1/shows/' + sid + '/episodes?limit=20&market=GB',
                                 { headers: { Authorization: 'Bearer ' + spToken() } });
          hit = pick(((await er.json()).items) || []);
        }
        if (!hit) {
          const q = encodeURIComponent((title + ' ' + showName).slice(0, 100));
          const sr = await fetch('https://api.spotify.com/v1/search?type=episode&limit=5&q=' + q,
                                 { headers: { Authorization: 'Bearer ' + spToken() } });
          hit = pick(((await sr.json()).episodes || {}).items || []);
        }
        if (!hit) throw new Error('no confident match');
        const uri = hit.uri;
        if (!target) {
          // phone with no Spotify device awake: hand the episode to the app
          btn.innerHTML = '&#9654;';
          window.location.href = 'https://open.spotify.com/episode/' + uri.split(':').pop();
          return;
        }
        const pr = await fetch('https://api.spotify.com/v1/me/player/play?device_id=' + target, {
          method: 'PUT',
          headers: { Authorization: 'Bearer ' + spToken(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ uris: [uri] }),
        });
        if (!pr.ok) {
          if (mobile) {
            btn.innerHTML = '&#9654;';
            window.location.href = 'https://open.spotify.com/episode/' + uri.split(':').pop();
            return;
          }
          throw new Error('play failed');
        }
        bar.style.display = (target === spDeviceId) ? 'flex' : 'none';
        btn.innerHTML = target === spDeviceId ? '&#9654;' : '&#10003;';
        if (target !== spDeviceId) setTimeout(() => { btn.innerHTML = '&#9654;'; }, 2500);
      } catch (_) {
        btn.innerHTML = '&#9654;';
        window.open(row.href, '_blank');
      }
    });
    row.appendChild(btn);
  });
}

// ---- listening: on-device voice + encrypted mp3 player ----
function wireListen() {
  const player = document.getElementById('lplayer');
  if (!player) return;

  // floating player bar for the neural-voice mp3s (mirrors the Spotify bar)
  const laudio = new Audio();
  const lbar = document.createElement('div');
  lbar.id = 'lbar';
  lbar.innerHTML = '<div id="lprog"><i></i></div>' +
                   '<span id="ltitle"></span>' +
                   '<span id="ltime"></span>' +
                   '<button id="lback" class="spsec" aria-label="back 15s">&#8630;15</button>' +
                   '<button id="lplay" aria-label="play/pause">&#10074;&#10074;</button>' +
                   '<button id="lfwd" class="spsec" aria-label="forward 15s">15&#8631;</button>' +
                   '<button id="lx" class="spsec" aria-label="close">&#10005;</button>';
  lbar.style.display = 'none';
  document.body.appendChild(lbar);
  const lfmt = t => {
    t = Math.floor(t || 0);
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
  };
  laudio.addEventListener('timeupdate', () => {
    document.getElementById('ltime').textContent = lfmt(laudio.currentTime) + ' / ' + lfmt(laudio.duration);
    if (laudio.duration) document.querySelector('#lprog i').style.width = (100 * laudio.currentTime / laudio.duration) + '%';
  });
  laudio.addEventListener('play',  () => { document.getElementById('lplay').innerHTML = '&#10074;&#10074;'; });
  laudio.addEventListener('pause', () => { document.getElementById('lplay').innerHTML = '&#9654;'; });
  document.getElementById('lplay').addEventListener('click', () => laudio.paused ? laudio.play() : laudio.pause());
  document.getElementById('lback').addEventListener('click', () => { laudio.currentTime = Math.max(0, laudio.currentTime - 15); });
  document.getElementById('lfwd').addEventListener('click', () => { laudio.currentTime = Math.min((laudio.duration || 1e9) - 1, laudio.currentTime + 15); });
  document.getElementById('lx').addEventListener('click', () => { laudio.pause(); lbar.style.display = 'none'; });

  document.querySelectorAll('.lbtn.speak').forEach(btn => {
    let mine = false;
    btn.addEventListener('click', () => {
      if (mine) {
        speechSynthesis.cancel(); mine = false;
        btn.classList.remove('playing'); btn.textContent = 'Siri voice';
        return;
      }
      const text = btn.closest('.lrow').dataset.text || '';
      speechSynthesis.cancel();
      const sentences = text.match(/[^.!?]+[.!?]+\s*|[^.!?]+$/g) || [text];
      const groups = [];
      let cur = '';
      for (const s of sentences) {
        if ((cur + s).length > 250) { if (cur) groups.push(cur); cur = s; }
        else cur += s;
      }
      if (cur) groups.push(cur);
      const voices = speechSynthesis.getVoices();
      const v = voices.find(x => x.lang === 'en-GB' && /siri|premium|enhanced/i.test(x.name))
             || voices.find(x => x.lang === 'en-GB') || null;
      groups.forEach((g, i) => {
        const u = new SpeechSynthesisUtterance(g);
        if (v) u.voice = v;
        if (i === groups.length - 1) u.onend = () => {
          mine = false; btn.classList.remove('playing'); btn.textContent = 'Siri voice';
        };
        speechSynthesis.speak(u);
      });
      mine = true; btn.classList.add('playing'); btn.textContent = 'Stop';
    });
  });

  document.querySelectorAll('.lbtn.pdfenc').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!PW) return;
      btn.textContent = 'Fetching…'; btn.disabled = true;
      try {
        const buf = new Uint8Array(await (await fetch(btn.dataset.enc)).arrayBuffer());
        const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.slice(28);
        const enc = new TextEncoder();
        const base = await crypto.subtle.importKey('raw', enc.encode(PW), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        const url = URL.createObjectURL(new Blob([plain], { type: 'application/pdf' }));
        window.open(url, '_blank');
        btn.textContent = 'Open PDF'; btn.disabled = false;
      } catch (_) {
        btn.textContent = 'Failed — tap to retry'; btn.disabled = false;
      }
    });
  });

  // deep link: #play=<article-id> auto-plays that article after unlock
  setTimeout(() => {
    const ph = location.hash.match(/play=([\w-]+)/);
    if (!ph) return;
    const btn = document.querySelector('.lbtn.mp3[data-enc="' + ph[1] + '.enc"]');
    if (btn) { btn.scrollIntoView({ block: 'center' }); btn.click(); }
  }, 600);

  // deep link: #art=<article-id> opens that article's own screen —
  // video auto-opens, PDF and audio one tap away (iMessage links land here)
  setTimeout(() => {
    const ah = location.hash.match(/art=([\w-]+)/);
    if (!ah) return;
    const id = ah[1];
    const mp3btn = document.querySelector('.lbtn.mp3[data-enc="' + id + '.enc"]');
    const lrow = mp3btn && mp3btn.closest('.lrow');
    const vbtn = lrow && lrow.querySelector('.lbtn.vid');
    const pbtn = lrow && lrow.querySelector('.lbtn.pdfenc');
    const ao = document.createElement('div');
    ao.id = 'artov';
    ao.style.cssText = 'position:fixed;inset:0;background:rgba(6,6,12,.88);z-index:58;display:flex;align-items:center;justify-content:center';
    const card = document.createElement('div');
    card.style.cssText = 'background:#16161f;border:1px solid #2a2a38;border-radius:16px;padding:24px 20px;width:86%;max-width:360px;text-align:center;color:#eee;font:15px/1.45 -apple-system,system-ui,sans-serif';
    const bs = 'display:block;width:100%;margin:10px 0;padding:13px;border-radius:10px;border:0;font-size:16px;font-weight:600;cursor:pointer';
    if (!lrow) {
      card.innerHTML = '<h3 style="margin:0 0 10px;font-size:17px">Not on the page yet</h3>' +
        '<p style="color:#9aa">If this just arrived, the page is still publishing — pull to refresh in a few minutes. Otherwise it has rolled off (rows keep 48 hours); the PDF, MP3 and video are in your work inbox email either way.</p>' +
        '<button id="artx" style="' + bs + ';background:#2a2a38;color:#eee">Close</button>';
    } else {
      const title = ((lrow.querySelector('.lmeta .t') || {}).textContent || 'Article').trim();
      const wbtn = lrow.querySelector('.lbtn.done');
      card.innerHTML = '<h3 style="margin:0 0 14px;font-size:17px">' + title.replace(/</g, '&lt;') + '</h3>' +
        (vbtn ? '<button id="artv" style="' + bs + ';background:#5b8cff;color:#fff">&#9654;&nbsp; Watch the video</button>' : '') +
        (pbtn ? '<button id="artp" style="' + bs + ';background:#2f2f40;color:#eee">Open the PDF</button>' : '') +
        '<button id="arta" style="' + bs + ';background:#2f2f40;color:#eee">&#127911;&nbsp; Listen</button>' +
        (wbtn ? '<button id="artw" style="' + bs + ';background:#1f2a1f;color:#9fd49f">&#10003;&nbsp; Mark as watched</button>' : '') +
        '<button id="artx" style="' + bs + ';background:transparent;color:#889;border:1px solid #2a2a38">Close &mdash; go to dashboard</button>';
    }
    ao.appendChild(card);
    document.body.appendChild(ao);
    const $ = i => document.getElementById(i);
    $('artx').addEventListener('click', () => { ao.style.display = 'none'; });
    if (lrow) {
      lrow.scrollIntoView({ block: 'center' });
      if ($('artv')) $('artv').addEventListener('click', () => { ao.style.display = 'none'; vbtn.click(); });
      if ($('artp')) $('artp').addEventListener('click', () => { pbtn.click(); });
      $('arta').addEventListener('click', () => { ao.style.display = 'none'; mp3btn.click(); });
      if ($('artw')) $('artw').addEventListener('click', () => {
        if (!lrow.classList.contains('watched')) wbtn.click();
        $('artw').innerHTML = '&#10003;&nbsp; Watched';
      });
      // closing the video brings the chooser back
      document.addEventListener('click', e => {
        if (e.target && e.target.id === 'vidx') ao.style.display = 'flex';
      });
      // auto-open the video when there is one
      if (vbtn) { ao.style.display = 'none'; vbtn.click(); }
    }
  }, 700);

  document.querySelectorAll('.lbtn.vid').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!PW) return;
      btn.textContent = 'Fetching…'; btn.disabled = true;
      try {
        const buf = new Uint8Array(await (await fetch(btn.dataset.enc)).arrayBuffer());
        const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.slice(28);
        const enc = new TextEncoder();
        const base = await crypto.subtle.importKey('raw', enc.encode(PW), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        const url = URL.createObjectURL(new Blob([plain], { type: 'video/mp4' }));
        let ov = document.getElementById('vidov');
        if (!ov) {
          ov = document.createElement('div');
          ov.id = 'vidov';
          ov.innerHTML = '<video controls autoplay playsinline></video><button id="vidx">&#10005;</button>';
          document.body.appendChild(ov);
          document.getElementById('vidx').addEventListener('click', () => {
            ov.querySelector('video').pause(); ov.style.display = 'none';
          });
        }
        ov.style.display = 'flex';
        ov.querySelector('video').src = url;
        btn.textContent = 'Video'; btn.disabled = false;
      } catch (_) {
        btn.textContent = 'Failed — tap to retry'; btn.disabled = false;
      }
    });
  });

  // "Mark watched" — same sync model as the check-in ticks: instant local
  // state (localStorage) + a note the checker turns into watched.csv, so the
  // greyed-out state follows him to every device on the next build.
  const wst = document.createElement('style');
  wst.textContent = '.lrow.watched{opacity:.45}.lrow.watched .lmeta .t{text-decoration:line-through}.lbtn.done{opacity:.8}';
  document.head.appendChild(wst);
  const WKEY = 'dash-watched';
  let wlocal = new Set();
  try { wlocal = new Set(JSON.parse(localStorage.getItem(WKEY) || '[]')); } catch (_) {}
  const wsave = () => { try { localStorage.setItem(WKEY, JSON.stringify([...wlocal])); } catch (_) {} };
  document.querySelectorAll('.lrow[data-id]').forEach(row => {
    const id = row.dataset.id;
    const btn = row.querySelector('.lbtn.done');
    if (!btn) return;
    const paint = () => {
      const on = row.classList.contains('watched');
      btn.innerHTML = on ? 'Watched &#10003;' : 'Mark watched';
    };
    if (wlocal.has(id)) row.classList.add('watched');
    paint();
    btn.addEventListener('click', () => {
      const now = !row.classList.contains('watched');
      row.classList.toggle('watched', now);
      if (now) wlocal.add(id); else wlocal.delete(id);
      wsave(); paint();
      sendNoteDirect((now ? 'Watched: ' : 'Unwatched: ') + id);
    });
  });

  document.querySelectorAll('.lbtn.mp3').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!PW) return;
      btn.textContent = 'Fetching…'; btn.disabled = true;
      try {
        const buf = new Uint8Array(await (await fetch(btn.dataset.enc)).arrayBuffer());
        const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.slice(28);
        const enc = new TextEncoder();
        const base = await crypto.subtle.importKey('raw', enc.encode(PW), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        const url = URL.createObjectURL(new Blob([plain], { type: 'audio/mpeg' }));
        laudio.src = url;
        laudio.play();
        const row = btn.closest('.lrow');
        const t = row && (row.querySelector('.lmeta .t') || row.querySelector('.lt'));
        document.getElementById('ltitle').textContent = (t ? t.textContent : 'Article').trim();
        lbar.style.display = 'flex';
        btn.textContent = 'Playing'; btn.disabled = false;
        setTimeout(() => { btn.textContent = 'Neural voice'; }, 2000);
      } catch (_) {
        btn.textContent = 'Failed — tap to retry'; btn.disabled = false;
      }
    });
  });
}

// ---- stay unlocked for the day ----
// After a successful unlock the password is kept in localStorage until 4am,
// so reopening the page the same day skips the lock screen. Device-local only.
const REMEMBER = 'dash-unlock';

function rememberUnlock(pw) {
  const exp = new Date();
  exp.setHours(28, 0, 0, 0); // 4am tomorrow
  try { localStorage.setItem(REMEMBER, JSON.stringify({ pw, exp: exp.getTime() })); } catch (_) {}
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('go');
  err.textContent = ''; btn.textContent = 'Unlocking…'; btn.disabled = true;
  try {
    const pw = document.getElementById('pw').value;
    const html = await unlock(pw);
    PW = pw;
    rememberUnlock(pw);
    reveal(html);
  } catch (_) {
    err.textContent = 'Wrong password';
    btn.textContent = 'Unlock'; btn.disabled = false;
    document.getElementById('pw').select();
  }
});

// ---- stale-page self-refresh ----
// GitHub Pages caches aggressively; compare our build id against the
// freshly-fetched version.txt when the page is opened or refocused.
async function checkFresh() {
  try {
    const v = (await (await fetch('version.txt?cb=' + Date.now(), { cache: 'no-store' })).text()).trim();
    if (v && v !== BUILDID) location.reload();
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkFresh();
});
setTimeout(checkFresh, 4000);
setInterval(checkFresh, 300000);

(async () => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(REMEMBER) || 'null'); } catch (_) {}
  if (!saved) return;
  if (saved.exp > Date.now()) {
    try { const html = await unlock(saved.pw); PW = saved.pw; reveal(html); return; } catch (_) {}
  }
  try { localStorage.removeItem(REMEMBER); } catch (_) {}
})();
</script>
