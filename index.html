<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232a78d6'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle' fill='white' font-family='system-ui' font-weight='700'%3EM%3C/text%3E%3C/svg%3E">
<title>Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page:#f4f4f1; --surface:#fcfcfb; --raised:#ffffff;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:#e1e0d9; --hair:rgba(11,11,11,.08);
  --blue:#2a78d6; --blue-wash:rgba(42,120,214,.08);
  --good:#0ca30c; --good-ink:#006300;
  --warn:#fab219; --hot:#d95926; --crit:#d03b3b;
  --hot-wash:rgba(217,89,38,.10);
  --crit-wash:rgba(208,59,59,.09);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --raised:#232322;
    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --hair:rgba(255,255,255,.09);
    --blue:#3987e5; --blue-wash:rgba(57,135,229,.14);
    --good-ink:#0ca30c; --hot:#eb6834;
    --hot-wash:rgba(235,104,52,.14);
    --crit-wash:rgba(208,59,59,.16);
  }
}
* { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body {
  background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.45; font-size:16px;
  padding:0 0 40px; margin:0 auto; max-width:560px;
}
a { color:inherit; }

header {
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  border-bottom:1px solid var(--hair);
}
.place { font-size:20px; font-weight:680; letter-spacing:-.02em; display:flex; align-items:center; gap:8px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--good); flex:none;
       box-shadow:0 0 0 0 rgba(12,163,12,.5); animation:pulse 2.6s infinite; }
@keyframes pulse { 70%{box-shadow:0 0 0 7px rgba(12,163,12,0)} 100%{box-shadow:0 0 0 0 rgba(12,163,12,0)} }
.stamp { font-size:12.5px; color:var(--muted); margin-top:3px; }

main { padding:0 14px; }
section { margin-top:18px; }
h2 {
  font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
  color:var(--muted); margin:0 4px 8px;
}
.card {
  background:var(--surface); border:1px solid var(--hair);
  border-radius:16px; padding:16px; margin-bottom:10px;
}
.hero { background:var(--surface); border:1px solid var(--hair); border-radius:18px; padding:18px; margin-top:14px; }
.hero .eyebrow { font-size:12px; font-weight:650; color:var(--blue); text-transform:uppercase; letter-spacing:.07em; }
.hero .big { font-size:27px; font-weight:680; letter-spacing:-.025em; line-height:1.15; margin:6px 0 8px; }
.hero p { font-size:14.5px; color:var(--ink2); }

.act { border-left:3px solid var(--crit); }
.act.warn { border-left-color:var(--warn); }
.act .t { font-size:16px; font-weight:650; letter-spacing:-.01em; }
.act .why { font-size:13.5px; color:var(--ink2); margin-top:5px; }
.btnrow { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:11px 15px; border-radius:11px; font-size:14.5px; font-weight:620;
  text-decoration:none; background:var(--blue); color:#fff; min-height:44px;
}
.btn.ghost { background:var(--blue-wash); color:var(--blue); }

.rail { display:flex; gap:8px; overflow-x:auto; padding:2px 4px 6px; scroll-snap-type:x mandatory; }
.rail::-webkit-scrollbar { display:none; }
.wx {
  flex:0 0 84px; scroll-snap-align:start; text-align:center;
  background:var(--surface); border:1px solid var(--hair);
  border-radius:14px; padding:11px 6px;
}
.wx.hot { background:var(--hot-wash); border-color:transparent; }
.wx.now { outline:2px solid var(--blue); outline-offset:-2px; }
.wx .d { font-size:11.5px; font-weight:680; color:var(--ink2); }
.wx .p { font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wx .i { font-size:22px; margin:4px 0 2px; }
.wx .t { font-size:17px; font-weight:700; letter-spacing:-.02em; }
.wx.hot .t { color:var(--hot); }
.wx .n { font-size:10px; color:var(--muted); }

.day { display:flex; gap:12px; padding:13px 0; border-top:1px solid var(--line); }
.day:first-child { border-top:none; padding-top:2px; }
.dl { flex:0 0 44px; }
.dl .dow { font-size:12px; font-weight:700; color:var(--ink2); }
.dl .num { font-size:19px; font-weight:680; letter-spacing:-.02em; line-height:1; }
.db { flex:1; min-width:0; }
.db .t { font-size:15px; font-weight:620; letter-spacing:-.01em; }
.db .s { font-size:13px; color:var(--ink2); margin-top:3px; }
.tag {
  display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px;
  border-radius:99px; margin-left:5px; vertical-align:1.5px; letter-spacing:.02em;
}
.tag.ok { background:var(--good); color:#fff; }
.tag.no { background:var(--crit); color:#fff; }
.tag.hot { background:var(--hot); color:#fff; }
.tag.blue { background:var(--blue-wash); color:var(--blue); }

.todo { display:flex; gap:11px; padding:12px 0; border-top:1px solid var(--line); align-items:flex-start; }
.todo:first-child { border-top:none; }
.box { flex:none; width:19px; height:19px; border:2px solid var(--muted); border-radius:6px; margin-top:2px; }
.todo .t { font-size:14.5px; font-weight:600; }
.todo .s { font-size:12.5px; color:var(--ink2); margin-top:2px; }
.later { opacity:.55; }
.note { font-size:13px; color:var(--ink2); background:var(--crit-wash); border-radius:12px; padding:12px 14px; }
footer { text-align:center; font-size:11.5px; color:var(--muted); padding:22px 20px 0; line-height:1.5; }

/* ---- lock screen ---- */
#lock { min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
#lock .mark { width:56px; height:56px; border-radius:16px; background:var(--blue); color:#fff; display:grid; place-items:center; font-size:26px; font-weight:700; margin-bottom:18px; }
#lock h1 { font-size:19px; font-weight:650; letter-spacing:-.02em; }
#lock p { font-size:14px; color:var(--ink2); margin-top:6px; max-width:280px; }
#lock form { display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px; margin-top:22px; }
#pw { width:100%; padding:14px 16px; font-size:16px; border-radius:12px; border:1px solid var(--hair); background:var(--surface); color:var(--ink); }
#pw:focus { outline:2px solid var(--blue); outline-offset:-1px; }
#go { padding:14px; font-size:16px; font-weight:650; border:0; border-radius:12px; background:var(--blue); color:#fff; min-height:48px; }
#err { color:var(--crit); font-size:13.5px; min-height:18px; }
#app { display:none; }
</style>
</head>
<body>

<div id="lock">
  <div class="mark">M</div>
  <h1>Dashboard</h1>
  <p>Save the password to your keychain once and Face ID will fill it from then on.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="matthew" autocomplete="username" hidden readonly>
    <input id="pw" type="password" name="password" autocomplete="current-password"
           placeholder="Password" enterkeyhint="go" autofocus>
    <button id="go" type="submit">Unlock</button>
    <div id="err"></div>
  </form>
</div>

<div id="app"></div>

const ITER = 310000;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(IV) }, key, b64(DATA));
  return new TextDecoder().decode(plain);
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('go');
  err.textContent = ''; btn.textContent = 'Unlocking…'; btn.disabled = true;
  try {
    const html = await unlock(document.getElementById('pw').value);
    document.getElementById('lock').remove();
    const app = document.getElementById('app');
    app.innerHTML = html;
    app.style.display = 'block';
    document.title = 'Matthew — Dashboard';
  } catch (_) {
    err.textContent = 'Wrong password';
    btn.textContent = 'Unlock'; btn.disabled = false;
    document.getElementById('pw').select();
  }
});
</script>
